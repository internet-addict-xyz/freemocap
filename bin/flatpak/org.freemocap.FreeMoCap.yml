app-id: org.freemocap.FreeMoCap
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.10"
branch: stable
command: freemocap
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
# TODO: change filesystem=home to only absolutely needed folders if you want to commit it to flathub.org in the future

modules:
  - name: freemocap-pkg
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands: # TODO: If you want to upload to flathub.org, the flatpak build needs to run offline, so: --no-deps
      - pip3 install --prefix=/app --ignore-requires-python . # Be careful with --ignore-requires-python, currently it uses Python 3.13.12 and not in '<3.13,>=3.10' as freemocap needs
    sources:
      - type: dir
        path: ../..

  - name: freemocap
    buildsystem: simple
    build-commands:
      - install -Dm755 freemocap.sh /app/bin/freemocap
      - install -Dm644 org.freemocap.FreeMoCap.desktop /app/share/applications/org.freemocap.FreeMoCap.desktop
      - install -Dm644 org.freemocap.FreeMoCap.metainfo.xml /app/share/metainfo/org.freemocap.FreeMoCap.metainfo.xml
      - install -Dm644 org.freemocap.FreeMoCap.svg /app/share/icons/hicolor/scalable/apps/org.freemocap.FreeMoCap.svg
    sources:
      - type: file
        path: freemocap.sh
      - type: file
        path: org.freemocap.FreeMoCap.desktop
      - type: file
        path: org.freemocap.FreeMoCap.metainfo.xml
      - type: file
        path: org.freemocap.FreeMoCap.svg
        dest-filename: freemocap-logo.svg
